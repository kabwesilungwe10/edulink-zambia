    /* =========================================

    const SUPABASE_URL = "https://doezgqeqqkqbpdjhsbdj.supabase.co";

    const SUPABASE_KEY = "sb_publishable_X7zw25SKdYhokEyhF-SmqA_qkZgWW8l";

    const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

    /* =========================================
       VARIABLES
       ========================================= */

    let allListings = [];


    /* =========================================
       LOAD ACCOMMODATION
       ========================================= */

    async function loadAccommodation() {

      const loading = document.getElementById("loading");
      const listings = document.getElementById("listings");
      const errorBox = document.getElementById("error");

      loading.style.display = "block";
      listings.innerHTML = "";
      errorBox.style.display = "none";

      const { data, error } = await supabaseClient
        .from("accommodations")
        .select("*")
        .eq("available", true)
        .order("created_at", { ascending: false });

      loading.style.display = "none";

      if (error) {

        console.error(error);

        errorBox.textContent =
          "Unable to load accommodation. Please try again.";

        errorBox.style.display = "block";

        return;
      }

      allListings = data || [];

      displayListings(allListings);
    }


    /* =========================================
       DISPLAY LISTINGS
       ========================================= */

    function displayListings(data) {

      const container = document.getElementById("listings");
      const empty = document.getElementById("empty");

      container.innerHTML = "";

      if (!data || data.length === 0) {

        empty.style.display = "block";

        return;
      }

      empty.style.display = "none";


      data.forEach(listing => {

        const card = document.createElement("div");

        card.className = "card";


        const price = Number(listing.price || 0)
          .toLocaleString("en-ZM");


        let contactButton = "";

        if (listing.contact) {

          const phone = String(listing.contact)
            .replace(/\s+/g, "");

          contactButton = `
            <a
              href="tel:${phone}"
              class="contact-btn"
            >
              📞 Contact Landlord
            </a>
          `;

        } else {

          contactButton = `
            <div class="contact-btn">
              Contact details unavailable
            </div>
          `;
        }


        card.innerHTML = `

          <div class="card-top">
            🏠
          </div>

          <div class="card-content">

            <span class="available">
              ● Available
            </span>

            <h3>
              ${escapeHTML(listing.title)}
            </h3>

            <div class="detail">
              📍 ${escapeHTML(listing.location)}
            </div>

            <div class="detail">
              🛏️ ${escapeHTML(listing.room_type)}
            </div>

            <div class="price">
              K${price} / month
            </div>

            <div class="description">
              ${escapeHTML(
                listing.description ||
                "No description provided."
              )}
            </div>

            ${contactButton}

          </div>

        `;

        container.appendChild(card);

      });

    }

<script>


function filterListings() {

  let search =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  let institution =
    document
      .getElementById("institution")
      .value;

  let type =
    document
      .getElementById("type")
      .value;


  let listings =
    document.querySelectorAll(".listing");


  listings.forEach(function(listing) {

    let location =
      listing
        .dataset
        .location
        .toLowerCase();

    let listingInstitution =
      listing
        .dataset
        .institution;

    let listingType =
      listing
        .dataset
        .type;


    let matchesSearch =
      location.includes(search);

    let matchesInstitution =
      institution === "" ||
      listingInstitution === institution;

    let matchesType =
      type === "" ||
      listingType === type;


    if (
      matchesSearch &&
      matchesInstitution &&
      matchesType
    ) {

      listing.style.display = "block";

    } else {

      listing.style.display = "none";

    }

  });

}


</script>
