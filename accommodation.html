<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Accommodation | EduLink Zambia</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f8fc;
      color: #172033;
    }

    header {
      background: #0756a3;
      color: white;
      padding: 17px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    .hero {
      background: #0756a3;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    .hero h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .filters {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 10px;
      background: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .card h3 {
      color: #0756a3;
      margin-bottom: 10px;
    }

    .detail {
      margin: 8px 0;
      color: #667085;
    }

    .price {
      color: #0756a3;
      font-size: 20px;
      font-weight: bold;
      margin: 14px 0;
    }

    .description {
      color: #667085;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .contact {
      display: block;
      text-align: center;
      padding: 11px;
      background: #0756a3;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }

    #loading,
    #empty,
    #error {
      text-align: center;
      padding: 35px 20px;
    }

    #empty,
    #error {
      display: none;
      background: white;
      border-radius: 12px;
    }

    #error {
      color: #b42318;
    }

    footer {
      margin-top: 40px;
      background: #101828;
      color: white;
      text-align: center;
      padding: 25px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🎓 EduLink Zambia</div>
  <a href="dashboard.html">← Dashboard</a>
</header>

<section class="hero">
  <h1>Student Accommodation</h1>
  <p>Find accommodation near your institution.</p>
</section>

<main class="container">

  <div class="filters">

    <input
      type="search"
      id="search"
      placeholder="🔎 Search location or accommodation..."
    >

    <select id="roomType">
      <option value="">All Room Types</option>
      <option value="Single Room">Single Room</option>
      <option value="Self Contained">Self Contained</option>
      <option value="Shared Room">Shared Room</option>
      <option value="House">House</option>
      <option value="Flat">Flat</option>
    </select>

  </div>

  <h2 style="color:#0756a3; margin-bottom:15px;">
    Available Accommodation
  </h2>

  <div id="loading">
    ⏳ Loading accommodation...
  </div>

  <div id="error"></div>

  <div id="empty">
    🏠 No accommodation listings found.
  </div>

  <div id="listings" class="grid"></div>

</main>

<footer>
  <p>🎓 EduLink Zambia</p>
  <p style="margin-top:7px;">
    Connecting Students. Connecting Opportunities.
  </p>
</footer>


<script>

const SUPABASE_URL =
  "https://doezgqeqqkqbpdjhsbdj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_X7zw25SKdYhokEyhF-SmqA_qkZgWW8l";


/* Create Supabase client */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let allListings = [];


/* Load accommodation */

async function loadAccommodation() {

  const loading =
    document.getElementById("loading");

  const errorBox =
    document.getElementById("error");

  const empty =
    document.getElementById("empty");

  try {

    console.log("Connecting to Supabase...");

    const result =
      await supabaseClient
        .from("accommodations")
        .select("*")
        .eq("available", true)
        .order("created_at", {
          ascending: false
        });

    console.log("Supabase response:", result);

    if (result.error) {
      throw result.error;
    }

    allListings =
      result.data || [];

    loading.style.display = "none";

    if (allListings.length === 0) {

      empty.style.display = "block";

      return;
    }

    displayListings(allListings);

  } catch (error) {

    console.error(
      "Accommodation error:",
      error
    );

    loading.style.display = "none";

    errorBox.textContent =
      "Unable to load accommodation: " +
      error.message;

    errorBox.style.display = "block";
  }

}


/* Display listings */

function displayListings(listings) {

  const container =
    document.getElementById("listings");

  const empty =
    document.getElementById("empty");

  container.innerHTML = "";

  if (listings.length === 0) {

    empty.style.display = "block";

    return;
  }

  empty.style.display = "none";


  listings.forEach(listing => {

    const card =
      document.createElement("div");

    card.className = "card";


    const price =
      Number(listing.price || 0)
        .toLocaleString("en-ZM");


    let contact = "";

    if (listing.contact) {

      contact = `
        <a
          class="contact"
          href="tel:${escapeHTML(listing.contact)}"
        >
          📞 Contact Landlord
        </a>
      `;

    }


    card.innerHTML = `

      <div class="icon">
        🏠
      </div>

      <h3>
        ${escapeHTML(listing.title)}
      </h3>

      <div class="detail">
        📍 ${escapeHTML(listing.location)}
      </div>

      <div class="detail">
        🛏️ ${escapeHTML(listing.room_type)}
      </div>

      <div class="price">
        K${price} / month
      </div>

      <div class="description">
        ${escapeHTML(
          listing.description ||
          "No description available."
        )}
      </div>

      ${contact}

    `;

    container.appendChild(card);

  });

}


/* Search */

function filterListings() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const room =
    document
      .getElementById("roomType")
      .value;


  const filtered =
    allListings.filter(listing => {

      const text =
        (
          listing.title +
          " " +
          listing.location
        ).toLowerCase();


      const searchMatch =
        !search ||
        text.includes(search);


      const roomMatch =
        !room ||
        listing.room_type === room;


      return (
        searchMatch &&
        roomMatch
      );

    });


  displayListings(filtered);

}


/* Basic HTML escaping */

function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;
}


/* Filters */

document
  .getElementById("search")
  .addEventListener(
    "input",
    filterListings
  );


document
  .getElementById("roomType")
  .addEventListener(
    "change",
    filterListings
  );


/* Start */

loadAccommodation();

</script>

</body>
</html>
