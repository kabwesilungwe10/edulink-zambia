<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Student Accommodation | EduLink Zambia</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f5f8fc;
  color: #172033;
}

header {
  background: #0756a3;
  color: white;
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 20px;
  font-weight: bold;
}

.back {
  color: white;
  text-decoration: none;
  font-size: 15px;
}

.hero {
  background: #0756a3;
  color: white;
  text-align: center;
  padding: 45px 20px 55px;
}

.hero h1 {
  font-size: 36px;
  margin-bottom: 12px;
}

.hero p {
  font-size: 18px;
  line-height: 1.5;
}

.search-section {
  width: 92%;
  max-width: 900px;
  margin: -25px auto 30px;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.search-section input,
.search-section select {
  width: 100%;
  padding: 14px;
  border: 1px solid #d0d5dd;
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 12px;
  background: white;
}

.container {
  width: 92%;
  max-width: 1100px;
  margin: 0 auto 50px;
}

.results-title {
  color: #0756a3;
  margin-bottom: 20px;
}

.listings {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  gap: 22px;
}

.card {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.image-container {
  position: relative;
  width: 100%;
  height: 230px;
  background: #e5e7eb;
  overflow: hidden;
}

.property-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.no-image {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 55px;
  color: #98a2b3;
}

.image-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  color: white;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.prev-btn {
  left: 10px;
}

.next-btn {
  right: 10px;
}

.image-counter {
  position: absolute;
  bottom: 10px;
  right: 10px;
  background: rgba(0,0,0,0.6);
  color: white;
  padding: 5px 9px;
  border-radius: 15px;
  font-size: 12px;
}

.card-content {
  padding: 18px;
}

.card-title {
  color: #0756a3;
  font-size: 21px;
  margin-bottom: 12px;
}

.info {
  margin: 8px 0;
  color: #667085;
  font-size: 15px;
  line-height: 1.4;
}

.price {
  color: #0756a3;
  font-size: 20px;
  font-weight: bold;
  margin: 12px 0;
}

.description {
  color: #667085;
  line-height: 1.5;
  margin-top: 12px;
}

/* =========================
   FAVOURITE BUTTON
========================= */

.favourite-btn {
  width: 100%;
  margin-top: 15px;
  padding: 11px;

  border: 2px solid #0756a3;
  border-radius: 8px;

  background: white;
  color: #0756a3;

  font-size: 15px;
  font-weight: bold;

  cursor: pointer;

  transition: 0.2s;
}

.favourite-btn:hover {
  background: #eef6ff;
}

.favourite-btn.saved {
  background: #0756a3;
  color: white;
}

/* =========================
   CONTACT BUTTONS
========================= */

.buttons {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.call-btn,
.whatsapp-btn {
  flex: 1;
  padding: 11px 8px;
  border: none;
  border-radius: 8px;
  color: white;
  text-align: center;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
}

.call-btn {
  background: #0756a3;
}

.whatsapp-btn {
  background: #16a34a;
}

.empty {
  text-align: center;
  padding: 60px 20px;
  color: #667085;
  font-size: 18px;
  grid-column: 1 / -1;
}

.loading {
  text-align: center;
  padding: 50px;
  color: #667085;
  font-size: 18px;
  grid-column: 1 / -1;
}

.message {
  display: none;
  width: 92%;
  max-width: 900px;
  margin: 20px auto;
  padding: 14px;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
}

.message.error {
  background: #fee2e2;
  color: #991b1b;
}

.message.success {
  background: #dcfce7;
  color: #166534;
}

footer {
  background: #101828;
  color: white;
  text-align: center;
  padding: 25px;
  margin-top: 50px;
}

@media (max-width: 600px) {

  .hero h1 {
    font-size: 30px;
  }

  .hero p {
    font-size: 16px;
  }

  .image-container {
    height: 220px;
  }

}

</style>

</head>

<body>

<header>

  <div class="logo">
    🎓 EduLink Zambia
  </div>

  <a href="dashboard.html" class="back">
    ← Dashboard
  </a>

</header>


<section class="hero">

  <h1>
    🏠 Student Accommodation
  </h1>

  <p>
    Find safe and affordable accommodation
    near your institution.
  </p>

</section>


<div
  id="message"
  class="message"
></div>


<section class="search-section">

  <input
    type="text"
    id="searchInput"
    placeholder="🔎 Search by property or location..."
  >

  <select id="roomFilter">

    <option value="">
      🏠 All Room Types
    </option>

    <option value="Single Room">
      Single Room
    </option>

    <option value="Self Contained">
      Self Contained
    </option>

    <option value="Shared Room">
      Shared Room
    </option>

    <option value="House">
      House
    </option>

    <option value="Flat">
      Flat
    </option>

  </select>

</section>


<main class="container">

  <h2 class="results-title">
    Available Accommodation
  </h2>

  <div
    id="listings"
    class="listings"
  >

    <div class="loading">
      Loading accommodation...
    </div>

  </div>

</main>


<footer>

  <p>
    🎓 EduLink Zambia
  </p>

  <p style="margin-top:7px;">
    Connecting Students. Connecting Opportunities.
  </p>

</footer>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://doezgqeqqkqbpdjhsbdj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_X7zw25SKdYhokEyhF-SmqA_qkZgWW8l";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   GLOBAL DATA
========================================= */

let allListings = [];

let currentUser = null;

const imageStates = {};

let favouriteIds = new Set();


/* =========================================
   GET CURRENT USER
========================================= */

async function getCurrentUser() {

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getUser();


  if (
    !error &&
    data &&
    data.user
  ) {

    currentUser =
      data.user;

  }

}


/* =========================================
   LOAD FAVOURITES
========================================= */

async function loadFavourites() {

  favouriteIds =
    new Set();


  if (!currentUser) {

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("favourites")
      .select("accommodation_id")
      .eq(
        "user_id",
        currentUser.id
      );


  if (error) {

    console.error(
      "Unable to load favourites:",
      error
    );

    return;

  }


  if (data) {

    data.forEach(
      function(item) {

        favouriteIds.add(
          item.accommodation_id
        );

      }
    );

  }

}


/* =========================================
   LOAD ACCOMMODATION
========================================= */

async function loadAccommodation() {

  const container =
    document.getElementById(
      "listings"
    );


  container.innerHTML =
    `<div class="loading">
      Loading accommodation...
    </div>`;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("accommodations")
      .select("*")
      .eq(
        "available",
        true
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    container.innerHTML =
      `<div class="empty">
        ❌ Unable to load accommodation.
        <br><br>
        ${escapeHTML(
          error.message
        )}
      </div>`;

    return;

  }


  allListings =
    data || [];


  displayListings(
    allListings
  );

}


/* =========================================
   DISPLAY LISTINGS
========================================= */

function displayListings(
  listings
) {

  const container =
    document.getElementById(
      "listings"
    );


  if (!listings.length) {

    container.innerHTML =
      `<div class="empty">
        🏠 No accommodation listings found.
        <br><br>
        Try changing your search or filter.
      </div>`;

    return;

  }


  container.innerHTML =
    "";


  listings.forEach(
    function(listing) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      /* =========================
         IMAGES
      ========================= */

      let images = [];


      if (
        Array.isArray(
          listing.image_urls
        )
      ) {

        images =
          listing.image_urls;

      }

      else if (
        typeof listing.image_urls === "string"
        &&
        listing.image_urls.trim() !== ""
      ) {

        try {

          images =
            JSON.parse(
              listing.image_urls
            );

        }

        catch {

          images =
            [
              listing.image_urls
            ];

        }

      }


      /* =========================
         IMAGE HTML
      ========================= */

      let imageHTML = "";


      if (
        images.length > 0
      ) {

        imageHTML = `

          <div class="image-container">

            <img
              id="image-${listing.id}"
              class="property-image"
              src="${escapeAttribute(
                images[0]
              )}"
              alt="${escapeAttribute(
                listing.title
              )}"
            >

            ${
              images.length > 1
              ? `

                <button
                  class="image-btn prev-btn"
                  onclick="changeImage(
                    '${listing.id}',
                    -1
                  )"
                >
                  ‹
                </button>

                <button
                  class="image-btn next-btn"
                  onclick="changeImage(
                    '${listing.id}',
                    1
                  )"
                >
                  ›
                </button>

                <div
                  class="image-counter"
                  id="counter-${listing.id}"
                >
                  1 / ${images.length}
                </div>

              `
              : ""
            }

          </div>

        `;

      }

      else {

        imageHTML = `

          <div class="image-container">

            <div class="no-image">
              🏠
            </div>

          </div>

        `;

      }


      /* =========================
         FAVOURITE STATE
      ========================= */

      const isFavourite =
        favouriteIds.has(
          listing.id
        );


      /* =========================
         CARD
      ========================= */

      card.innerHTML = `

        ${imageHTML}

        <div class="card-content">

          <h3 class="card-title">
            ${escapeHTML(
              listing.title
            )}
          </h3>

          <div class="info">
            📍 ${escapeHTML(
              listing.location
            )}
          </div>

          <div class="price">
            💰 K${Number(
              listing.price || 0
            ).toLocaleString()}
            / month
          </div>

          <div class="info">
            🛏️ ${escapeHTML(
              listing.room_type
            )}
          </div>

          <div class="info">
            🟢 Available
          </div>

          ${
            listing.description
            ? `
              <div class="description">
                ${escapeHTML(
                  listing.description
                )}
              </div>
            `
            : ""
          }


          <button
            id="favourite-${listing.id}"
            class="favourite-btn ${
              isFavourite
                ? "saved"
                : ""
            }"
            onclick="toggleFavourite(
              '${listing.id}'
            )"
          >

            ${
              isFavourite
              ? "★ Saved"
              : "☆ Save"
            }

          </button>


          <div class="buttons">

            <a
              class="call-btn"
              href="tel:${escapeAttribute(
                listing.contact
              )}"
            >
              📞 Call
            </a>

            <a
              class="whatsapp-btn"
              href="${whatsappLink(
                listing.contact
              )}"
              target="_blank"
            >
              💬 WhatsApp
            </a>

          </div>

        </div>

      `;


      container.appendChild(
        card
      );


      imageStates[
        listing.id
      ] = {

        images:
          images,

        index:
          0

      };

    }
  );

}


/* =========================================
   TOGGLE FAVOURITE
========================================= */

async function toggleFavourite(
  accommodationId
) {

  /* -------------------------
     Check login
  ------------------------- */

  if (!currentUser) {

    showMessage(
      "Please log in to save accommodation.",
      "error"
    );

    setTimeout(
      function() {

        window.location.href =
          "login.html";

      },
      1200
    );

    return;

  }


  const button =
    document.getElementById(
      `favourite-${accommodationId}`
    );


  const isSaved =
    favouriteIds.has(
      accommodationId
    );


  /* -------------------------
     Remove favourite
  ------------------------- */

  if (isSaved) {

    const {
      error
    } =
      await supabaseClient
        .from("favourites")
        .delete()
        .eq(
          "user_id",
          currentUser.id
        )
        .eq(
          "accommodation_id",
          accommodationId
        );


    if (error) {

      console.error(error);

      showMessage(
        "Unable to remove favourite: " +
        error.message,
        "error"
      );

      return;

    }


    favouriteIds.delete(
      accommodationId
    );


    if (button) {

      button.classList.remove(
        "saved"
      );

      button.textContent =
        "☆ Save";

    }


    showMessage(
      "Removed from saved accommodation.",
      "success"
    );


    return;

  }


  /* -------------------------
     Add favourite
  ------------------------- */

  const {
    error
  } =
    await supabaseClient
      .from("favourites")
      .insert({

        user_id:
          currentUser.id,

        accommodation_id:
          accommodationId

      });


  if (error) {

    console.error(error);

    showMessage(
      "Unable to save accommodation: " +
      error.message,
      "error"
    );

    return;

  }


  favouriteIds.add(
    accommodationId
  );


  if (button) {

    button.classList.add(
      "saved"
    );

    button.textContent =
      "★ Saved";

  }


  showMessage(
    "Accommodation saved successfully! ⭐",
    "success"
  );

}


/* =========================================
   IMAGE CAROUSEL
========================================= */

function changeImage(
  listingId,
  direction
) {

  const state =
    imageStates[
      listingId
    ];


  if (
    !state ||
    !state.images.length
  ) {

    return;

  }


  state.index +=
    direction;


  if (
    state.index < 0
  ) {

    state.index =
      state.images.length - 1;

  }


  if (
    state.index >=
    state.images.length
  ) {

    state.index =
      0;

  }


  const image =
    document.getElementById(
      `image-${listingId}`
    );


  const counter =
    document.getElementById(
      `counter-${listingId}`
    );


  if (image) {

    image.src =
      state.images[
        state.index
      ];

  }


  if (counter) {

    counter.textContent =
      `${state.index + 1} / ${
        state.images.length
      }`;

  }

}


/* =========================================
   SEARCH
========================================= */

function filterListings() {

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  const room =
    document
      .getElementById(
        "roomFilter"
      )
      .value;


  const filtered =
    allListings.filter(
      function(listing) {

        const matchesSearch =
          !search
          ||
          String(
            listing.title || ""
          )
          .toLowerCase()
          .includes(search)
          ||
          String(
            listing.location || ""
          )
          .toLowerCase()
          .includes(search);


        const matchesRoom =
          !room
          ||
          listing.room_type ===
          room;


        return (
          matchesSearch &&
          matchesRoom
        );

      }
    );


  displayListings(
    filtered
  );

}


/* =========================================
   WHATSAPP
========================================= */

function whatsappLink(
  number
) {

  let phone =
    String(
      number || ""
    )
    .replace(
      /\D/g,
      ""
    );


  if (
    phone.startsWith("0")
  ) {

    phone =
      "260" +
      phone.substring(1);

  }


  return (
    "https://wa.me/" +
    phone
  );

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message " +
    type;


  message.style.display =
    "block";


  setTimeout(
    function() {

      message.style.display =
        "none";

    },
    3000
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
  value
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    value ?? "";


  return div.innerHTML;

}


function escapeAttribute(
  value
) {

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  );

}


/* =========================================
   SEARCH EVENTS
========================================= */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    filterListings
  );


document
  .getElementById(
    "roomFilter"
  )
  .addEventListener(
    "change",
    filterListings
  );


/* =========================================
   START
========================================= */

async function start() {

  await getCurrentUser();

  await loadFavourites();

  await loadAccommodation();

}


start();

</script>

</body>
</html>
