<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Programs | EduLink Zambia</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f8fc;
      color: #172033;
    }

    header {
      background: #0756a3;
      color: white;
      padding: 16px 20px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .hero {
      background: #0756a3;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    .hero h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .hero p {
      opacity: 0.9;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 18px;
    }

    .search-box {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 25px;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.06);
    }

    .search-box input,
    .search-box select {
      width: 100%;
      padding: 14px;

      border: 1px solid #d0d5dd;
      border-radius: 8px;

      font-size: 15px;
      outline: none;

      background: white;
    }

    .search-box input {
      margin-bottom: 12px;
    }

    .search-box input:focus,
    .search-box select:focus {
      border-color: #0756a3;
    }

    .section-title {
      color: #0756a3;
      margin-bottom: 15px;
    }

    .programs {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .program-card {
      background: white;
      padding: 20px;
      border-radius: 12px;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.06);
    }

    .program-icon {
      width: 55px;
      height: 55px;

      background: #e8f2ff;
      color: #0756a3;

      border-radius: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 27px;

      margin-bottom: 15px;
    }

    .program-card h3 {
      color: #0756a3;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .institution {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .details {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 10px 0;
    }

    .badge {
      background: #eef4ff;
      color: #0756a3;

      padding: 6px 9px;
      border-radius: 15px;

      font-size: 12px;
    }

    .description {
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 10px;
    }

    #loading {
      text-align: center;
      padding: 40px;
      color: #667085;
    }

    #empty {
      display: none;
      text-align: center;
      padding: 40px;
      color: #667085;
    }

    footer {
      margin-top: 35px;
      background: #101828;
      color: white;
      text-align: center;
      padding: 25px;
    }

    footer p {
      margin-top: 7px;
      color: #d0d5dd;
      font-size: 13px;
    }

    @media (min-width: 650px) {

      .programs {
        grid-template-columns: repeat(2, 1fr);
      }

      .filters {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

    }

    @media (max-width: 649px) {

      .filters > * {
        margin-bottom: 10px;
      }

    }

    @media (min-width: 950px) {

      .programs {
        grid-template-columns: repeat(3, 1fr);
      }

    }

  </style>

</head>


<body>


<header>

  <div class="logo">
    🎓 EduLink Zambia
  </div>

  <a href="dashboard.html"
     class="back">
    ← Dashboard
  </a>

</header>


<section class="hero">

  <h1>
    Academic Programs
  </h1>

  <p>
    Discover programs offered by institutions across Zambia.
  </p>

</section>


<main class="container">


  <div class="search-box">

    <input
      type="search"
      id="searchInput"
      placeholder="🔎 Search for a program..."
      oninput="filterPrograms()">


    <div class="filters">

      <select
        id="institutionFilter"
        onchange="filterPrograms()">

        <option value="all">
          All Institutions
        </option>

      </select>


      <select
        id="fieldFilter"
        onchange="filterPrograms()">

        <option value="all">
          All Fields
        </option>

      </select>


      <select
        id="levelFilter"
        onchange="filterPrograms()">

        <option value="all">
          All Levels
        </option>

      </select>

    </div>

  </div>


  <h2 class="section-title">
    Programs
  </h2>


  <div id="loading">
    Loading programs...
  </div>


  <div
    class="programs"
    id="programsList">
  </div>


  <div id="empty">
    No programs found.
  </div>


</main>


<footer>

  <h3>
    🎓 EduLink Zambia
  </h3>

  <p>
    Connecting Students. Connecting Opportunities.
  </p>

  <p>
    © 2026 EduLink Zambia
  </p>

</footer>


<script>


/* =========================================
   SUPABASE
========================================= */


const SUPABASE_URL =
  "https://doezgqeqqkqbpdjhsbdj.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_X7zw25SKdYhokEyhF-SmqA_qkZgWW8l";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================
   VARIABLES
========================================= */


let allPrograms = [];


/* =========================================
   LOAD PROGRAMS
========================================= */


async function loadPrograms() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("programs")
      .select(`
        id,
        name,
        field,
        level,
        duration,
        description,
        institutions (
          id,
          name,
          location
        )
      `)
      .order("name");


  document
    .getElementById("loading")
    .style.display = "none";


  if (error) {

    console.error(error);

    document
      .getElementById("empty")
      .style.display = "block";

    document
      .getElementById("empty")
      .textContent =
        "Unable to load programs.";

    return;

  }


  allPrograms = data || [];


  populateFilters(
    allPrograms
  );


  displayPrograms(
    allPrograms
  );

}


/* =========================================
   FILTER OPTIONS
========================================= */


function populateFilters(
  programs
) {

  const institutions =
    new Set();

  const fields =
    new Set();

  const levels =
    new Set();


  programs.forEach(
    function(program) {

      if (program.institutions) {

        institutions.add(
          program.institutions.name
        );

      }

      if (program.field) {

        fields.add(
          program.field
        );

      }

      if (program.level) {

        levels.add(
          program.level
        );

      }

    }
  );


  const institutionFilter =
    document.getElementById(
      "institutionFilter"
    );


  const fieldFilter =
    document.getElementById(
      "fieldFilter"
    );


  const levelFilter =
    document.getElementById(
      "levelFilter"
    );


  institutions.forEach(
    function(name) {

      institutionFilter.innerHTML +=
        `<option value="${escapeAttribute(name)}">
          ${escapeHTML(name)}
        </option>`;

    }
  );


  fields.forEach(
    function(field) {

      fieldFilter.innerHTML +=
        `<option value="${escapeAttribute(field)}">
          ${escapeHTML(field)}
        </option>`;

    }
  );


  levels.forEach(
    function(level) {

      levelFilter.innerHTML +=
        `<option value="${escapeAttribute(level)}">
          ${escapeHTML(level)}
        </option>`;

    }
  );

}


/* =========================================
   DISPLAY PROGRAMS
========================================= */


function displayPrograms(
  programs
) {

  const container =
    document.getElementById(
      "programsList"
    );


  container.innerHTML = "";


  if (programs.length === 0) {

    document
      .getElementById("empty")
      .style.display = "block";

    return;

  }


  document
    .getElementById("empty")
    .style.display = "none";


  programs.forEach(
    function(program) {

      const card =
        document.createElement("div");


      card.className =
        "program-card";


      const institutionName =
        program.institutions?.name ||
        "Institution not available";


      const location =
        program.institutions?.location ||
        "";


      card.innerHTML = `

        <div class="program-icon">
          📚
        </div>

        <h3>
          ${escapeHTML(program.name)}
        </h3>

        <div class="institution">
          🎓 ${escapeHTML(institutionName)}
        </div>

        <div class="details">

          <span class="badge">
            ${escapeHTML(program.field)}
          </span>

          <span class="badge">
            ${escapeHTML(program.level)}
          </span>

          ${
            program.duration
            ?
            `<span class="badge">
              ⏱ ${escapeHTML(program.duration)}
            </span>`
            :
            ""
          }

        </div>

        ${
          location
          ?
          `<div class="description">
            📍 ${escapeHTML(location)}
          </div>`
          :
          ""
        }

        <div class="description">
          ${escapeHTML(
            program.description ||
            "No description available."
          )}
        </div>

      `;


      container.appendChild(card);

    }
  );

}


/* =========================================
   FILTER PROGRAMS
========================================= */


function filterPrograms() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  const institution =
    document
      .getElementById("institutionFilter")
      .value;


  const field =
    document
      .getElementById("fieldFilter")
      .value;


  const level =
    document
      .getElementById("levelFilter")
      .value;


  const filtered =
    allPrograms.filter(
      function(program) {


        const institutionName =
          program.institutions?.name ||
          "";


        const matchesSearch =
          program.name
            .toLowerCase()
            .includes(search) ||

          program.field
            .toLowerCase()
            .includes(search) ||

          institutionName
            .toLowerCase()
            .includes(search);


        const matchesInstitution =
          institution === "all" ||
          institutionName === institution;


        const matchesField =
          field === "all" ||
          program.field === field;


        const matchesLevel =
          level === "all" ||
          program.level === level;


        return (
          matchesSearch &&
          matchesInstitution &&
          matchesField &&
          matchesLevel
        );

      }
    );


  displayPrograms(
    filtered
  );

}


/* =========================================
   SECURITY HELPERS
========================================= */


function escapeHTML(value) {

  if (!value) return "";

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

  return escapeHTML(value);

}


/* =========================================
   START
========================================= */


loadPrograms();


</script>


</body>

</html>
