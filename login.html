<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Login | EduLink Zambia</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f8fc;
      color: #172033;
    }

    header {
      background: #0756a3;
      color: white;
      padding: 16px 20px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
    }

    .home-link {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .page {
      min-height: calc(100vh - 65px);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 18px;
    }

    .auth-card {
      width: 100%;
      max-width: 450px;

      background: white;

      padding: 30px 25px;

      border-radius: 15px;

      box-shadow:
        0 5px 25px rgba(0,0,0,0.08);
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-icon {
      width: 70px;
      height: 70px;

      background: #e8f2ff;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      margin: 0 auto 15px;

      font-size: 35px;
    }

    .brand h1 {
      color: #0756a3;
      font-size: 27px;
      margin-bottom: 7px;
    }

    .brand p {
      color: #667085;
      font-size: 14px;
    }

    .tabs {
      display: flex;

      background: #f2f4f7;

      padding: 4px;

      border-radius: 9px;

      margin-bottom: 25px;
    }

    .tab {
      width: 50%;

      padding: 11px;

      border: none;

      background: transparent;

      border-radius: 7px;

      cursor: pointer;

      font-weight: bold;

      color: #667085;
    }

    .tab.active {
      background: white;
      color: #0756a3;

      box-shadow:
        0 2px 6px rgba(0,0,0,0.08);
    }

    .account-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .account-types {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .account-type {
      border: 1px solid #d0d5dd;

      background: white;

      padding: 12px 5px;

      border-radius: 8px;

      text-align: center;

      cursor: pointer;

      font-size: 12px;
    }

    .account-type span {
      display: block;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .account-type.active {
      border-color: #0756a3;
      background: #e8f2ff;
      color: #0756a3;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;

      padding: 13px;

      border: 1px solid #d0d5dd;

      border-radius: 8px;

      outline: none;

      font-size: 15px;
    }

    .form-group input:focus {
      border-color: #0756a3;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 50px;
    }

    .show-password {
      position: absolute;

      right: 12px;

      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      cursor: pointer;

      font-size: 18px;
    }

    .forgot {
      display: block;

      text-align: right;

      margin-top: -7px;

      margin-bottom: 20px;

      color: #0756a3;

      text-decoration: none;

      font-size: 13px;
    }

    .submit-button {
      width: 100%;

      padding: 14px;

      background: #0756a3;

      color: white;

      border: none;

      border-radius: 8px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 7px;

      text-align: center;

      font-size: 13px;
    }

    .message.success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
    }

    .message.error {
      display: block;
      background: #fef3f2;
      color: #b42318;
    }

    .divider {
      display: flex;

      align-items: center;

      gap: 10px;

      margin: 23px 0;

      color: #98a2b3;

      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";

      flex: 1;

      height: 1px;

      background: #eaecf0;
    }

    .footer-text {
      text-align: center;

      color: #667085;

      font-size: 13px;

      line-height: 1.6;
    }

    .footer-text a {
      color: #0756a3;

      font-weight: bold;

      text-decoration: none;
    }

    #registerFields {
      display: none;
    }

  </style>

</head>


<body>


<header>

  <div class="logo">
    🎓 EduLink Zambia
  </div>

  <a
    href="index.html"
    class="home-link">

    ← Home

  </a>

</header>


<main class="page">


  <section class="auth-card">


    <div class="brand">

      <div class="brand-icon">
        🎓
      </div>

      <h1>Welcome to EduLink</h1>

      <p>
        Connecting Students. Connecting Opportunities.
      </p>

    </div>


    <div class="tabs">

      <button
        class="tab active"
        id="loginTab"
        onclick="showLogin()">

        Login

      </button>

      <button
        class="tab"
        id="registerTab"
        onclick="showRegister()">

        Create Account

      </button>

    </div>


    <div class="account-title">
      I am a...
    </div>


    <div class="account-types">


      <div
        class="account-type active"
        onclick="selectAccount(this, 'student')">

        <span>👨‍🎓</span>

        Student

      </div>


      <div
        class="account-type"
        onclick="selectAccount(this, 'tutor')">

        <span>👨‍🏫</span>

        Tutor

      </div>


      <div
        class="account-type"
        onclick="selectAccount(this, 'landlord')">

        <span>🏠</span>

        Landlord

      </div>


    </div>


    <form
      id="authForm"
      onsubmit="handleSubmit(event)">


      <div id="registerFields">


        <div class="form-group">

          <label for="fullName">
            Full Name
          </label>

          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name">

        </div>


        <div class="form-group">

          <label for="phone">
            Phone Number
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="+260 97 123 4567">

        </div>


        <div class="form-group">

          <label for="institution">
            University / College
          </label>

          <input
            type="text"
            id="institution"
            placeholder="Enter your institution">

        </div>


      </div>


      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required>

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            minlength="6"
            required>

          <button
            type="button"
            class="show-password"
            onclick="togglePassword()">

            👁️

          </button>

        </div>

      </div>


      <a
        href="#"
        class="forgot"
        id="forgotPassword"
        onclick="resetPassword(event)">

        Forgot password?

      </a>


      <button
        type="submit"
        class="submit-button"
        id="submitButton">

        Login

      </button>


      <div
        class="message"
        id="message">
      </div>


    </form>


    <div class="divider">
      EduLink Zambia
    </div>


    <div class="footer-text">

      By creating an account, you agree to use
      EduLink Zambia responsibly.

      <br><br>

      <a href="index.html">
        Continue browsing without an account
      </a>

    </div>


  </section>


</main>


<script>


/* =========================================
   SUPABASE CONNECTION
========================================= */


const SUPABASE_URL =
  "https://doezgqeqqkqbpdjhsbdj.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_X7zw25SKdYhokEyhF-SmqA_qkZgWW8l";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================
   VARIABLES
========================================= */


let selectedAccount = "student";

let isRegister = false;


/* =========================================
   ACCOUNT TYPE
========================================= */


function selectAccount(element, type) {

  document
    .querySelectorAll(".account-type")
    .forEach(function(item) {

      item.classList.remove("active");

    });


  element.classList.add("active");

  selectedAccount = type;

}


/* =========================================
   LOGIN MODE
========================================= */


function showLogin() {

  isRegister = false;


  document
    .getElementById("loginTab")
    .classList.add("active");


  document
    .getElementById("registerTab")
    .classList.remove("active");


  document
    .getElementById("registerFields")
    .style.display = "none";


  document
    .getElementById("submitButton")
    .textContent = "Login";


  document
    .getElementById("forgotPassword")
    .style.display = "block";


  clearMessage();

}


/* =========================================
   REGISTER MODE
========================================= */


function showRegister() {

  isRegister = true;


  document
    .getElementById("registerTab")
    .classList.add("active");


  document
    .getElementById("loginTab")
    .classList.remove("active");


  document
    .getElementById("registerFields")
    .style.display = "block";


  document
    .getElementById("submitButton")
    .textContent = "Create Account";


  document
    .getElementById("forgotPassword")
    .style.display = "none";


  clearMessage();

}


/* =========================================
   PASSWORD VISIBILITY
========================================= */


function togglePassword() {

  const password =
    document.getElementById("password");

  const button =
    document.querySelector(".show-password");


  if (password.type === "password") {

    password.type = "text";

    button.textContent = "🙈";

  } else {

    password.type = "password";

    button.textContent = "👁️";

  }

}


/* =========================================
   MAIN FORM
========================================= */


async function handleSubmit(event) {

  event.preventDefault();


  clearMessage();


  const button =
    document.getElementById("submitButton");


  button.disabled = true;


  button.textContent =
    isRegister
      ? "Creating Account..."
      : "Logging in...";


  try {

    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    if (isRegister) {

      await registerUser(
        email,
        password
      );

    } else {

      await loginUser(
        email,
        password
      );

    }

  } catch (error) {

    showMessage(
      error.message ||
      "Something went wrong. Please try again.",
      "error"
    );

  } finally {

    button.disabled = false;

    button.textContent =
      isRegister
        ? "Create Account"
        : "Login";

  }

}


/* =========================================
   REGISTER USER
========================================= */


async function registerUser(
  email,
  password
) {

  const fullName =
    document
      .getElementById("fullName")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const institution =
    document
      .getElementById("institution")
      .value
      .trim();


  if (!fullName) {

    throw new Error(
      "Please enter your full name."
    );

  }


  if (!phone) {

    throw new Error(
      "Please enter your phone number."
    );

  }


  if (!institution) {

    throw new Error(
      "Please enter your university or college."
    );

  }


  const {
    data,
    error
  } =
    await supabaseClient.auth.signUp({

      email: email,

      password: password,

      options: {

        data: {

          full_name: fullName,

          account_type: selectedAccount,

          phone: phone,

          institution: institution

        }

      }

    });


  if (error) {

    throw error;

  }


  if (!data.user) {

    throw new Error(
      "Account could not be created."
    );

  }


  /*
    Create the user's public profile.
  */


  const {
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .insert({

        id: data.user.id,

        full_name: fullName,

        phone: phone,

        account_type: selectedAccount,

        institution: institution

      });


  if (profileError) {

    console.error(
      "Profile error:",
      profileError
    );

  }


  showMessage(

    "Account created successfully! Check your email if confirmation is required.",

    "success"

  );


  document
    .getElementById("authForm")
    .reset();


}


/* =========================================
   LOGIN USER
========================================= */


async function loginUser(
  email,
  password
) {


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    throw error;

  }


  if (!data.user) {

    throw new Error(
      "Login failed."
    );

  }


  showMessage(
    "Login successful! Redirecting...",
    "success"
  );


  setTimeout(function() {

    window.location.href =
      "dashboard.html";

  }, 1200);

}


/* =========================================
   PASSWORD RESET
========================================= */


async function resetPassword(event) {

  event.preventDefault();


  const email =
    document
      .getElementById("email")
      .value
      .trim();


  if (!email) {

    showMessage(
      "Enter your email address first.",
      "error"
    );

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .auth
      .resetPasswordForEmail(

        email,

        {

          redirectTo:
            window.location.origin +
            window.location.pathname

        }

      );


  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;

  }


  showMessage(
    "Password reset instructions have been sent to your email.",
    "success"
  );

}


/* =========================================
   MESSAGE
========================================= */


function showMessage(
  text,
  type
) {

  const message =
    document
      .getElementById("message");


  message.textContent = text;


  message.className =
    "message " + type;

}


/* =========================================
   CLEAR MESSAGE
========================================= */


function clearMessage() {

  const message =
    document
      .getElementById("message");


  message.textContent = "";

  message.className =
    "message";

}


</script>


</body>

</html>
